<div class="blog-post-sharing mt-4 mt-md-0 pr-4 mr-2" id="{{ name }}">
  <span class="blog-post-sharing__title d-block mb-3">{{ module.title }}</span>
  <ul class="d-flex flex-md-column align-items-center">
    <li class="pr-3 pr-md-0">
      <a href="https://www.facebook.com/share.php?u={{ content.absolute_url }}" target="_blank" rel="noopener" class="blog-post-sharing__icon" aria-label="Share on Facebook">
        {% icon name='facebook-f', style='solid' %}
      </a>
    </li>
    <li class="pr-3 pr-md-0">
      <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ content.absolute_url }}" target="_blank" rel="noopener" class="blog-post-sharing__icon" aria-label="Share on LinkedIn">
        {% icon name='linkedin-in', style='solid' %}
      </a>
    </li>
    <li class="pr-3 pr-md-0">
      <a href="mailto:?subject=Check out {{ content.absolute_url }}&body=Check out {{ content.absolute_url }}&media={{ content.featured_image }}" target="_blank" rel="noopener" class="blog-post-sharing__icon" aria-label="Share by email">
        {% icon name='envelope', style='solid' %}
      </a>
    </li>
    <li class="pr-3 pr-md-0">
      <a href="https://pinterest.com/pin/create/button/?url={{ content.absolute_url }}" target="_blank" rel="noopener" class="blog-post-sharing__icon" aria-label="Share on Pinterest">
        {% icon name='pinterest', style='SOLID' %}
      </a>
    </li>
    <li class="pr-3 pr-md-0">
      <a href="https://x.com/intent/tweet?text=I+found+this+interesting+blog+post&url={{ content.absolute_url }}" target="_blank" rel="noopener" class="blog-post-sharing__icon" aria-label="Share on X">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
      </a>
    </li>
  </ul>
</div>
{% require_css %}
<style>
  #{{ name }} .blog-post-sharing__icon path {
    fill: rgba( {{ module.style.icon_color.color | convert_rgb }} , {{ module.style.icon_color.opacity * 0.01 }});
  }
  #{{ name }}  .blog-post-sharing__title {
    color: rgba( {{ module.style.icon_color.color | convert_rgb }} , {{ module.style.icon_color.opacity * 0.01 }});
  }
</style>
{% end_require_css %}

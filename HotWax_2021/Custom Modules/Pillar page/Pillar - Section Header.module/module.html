{# Genral Section #}
<section id="{{ module.id_section }}" class="pillar-section-banner banner-content">
  {% if module.boolean_field %}
    <p class="banner-content__number">{{ module.number }}</p>
  {% endif %}
  <h2>{{ module.text_content }}</h2>
</section>

{% require_css %}
<style>
  .banner-content__section{
    scroll-margin-top: 0px;
  }

  section {
    display: grid;
    align-items: center;
  }

  section>p {
    grid-column: 2;
    grid-row: 1;
  }

  section>* {
    grid-column: 1;
    grid-row: 1;
    margin: 0;
  }

  .banner-content {
    position: relative;
    margin-top: 0;
    margin-bottom: 0;
    margin-right: 0;
    padding-top: var(--spacer-sm);
    padding-bottom: 0;
    padding-left: var(--spacer-sm);
    padding-right: 0;
    {# Background Image #}
    {{ module.style.backgroundimage_field.css }}
  }
  .banner-content::before{
    position:absolute;
    content:"";
    top:0;
    bottom: 0;
    right:0;
    left:0;
    background-color: rgba({{ module.style.background_overlay.color | convert_rgb }}, {{module.style.background_overlay.opacity * 0.01 }});
  }
  .banner-content__number{
    text-align: right;
    font-size: var(--font-size-xl);
    font-family: var(--font-family-special);
    font-weight: var(--font-weight-bold);
    line-height: 150%;
    margin: 0;
  }
  
  @media (max-width: 1279px) {
     .banner-content{
      background-position: right bottom;
    }
  }
  {# ---- Tablet Breakpoint ---- #}
  @media (max-width: 768px) {
    .banner-content{
      padding: var(--spacer-md);
    }
    .banner-content {
      background-position: right bottom;
    }
  }

  {# ---- Desktop Breakpoint ---- #}
  @media (min-width: {{ theme.layout.responsive_breakpoint }}px) {
    .banner-content {
      min-height: 180px;
      margin-block: var(--spacer-lg);
    }
  }

</style>
{% end_require_css %}

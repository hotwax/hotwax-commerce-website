{% from 'hotwax-theme/macros/button.html' import button %}
<div class="hs-banner-wrapper" style="--sun-visible-height: {{ module.sun_visible_percent|default(20) }}vh;">
  <div class="page-center">
    <div id="canvas" class="div-block-2"></div>
    <div class="hs-banner-content">
      <h2 class="small-header subheader">{{ module.banner_title }}</h2>
      <h1>{{ module.banner_heading }}</h1>
      <p class="banner-description">{{ module.banner_description }}</p>
      {% if module.button_text and module.link.url.href %}
      {{ button(module.link, module.button_text) }}
      {% endif %}
    </div>
  </div>
</div>

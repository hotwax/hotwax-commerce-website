{% from 'hotwax-theme/macros/button.html' import button %}
<div class="text-cta-wrapper">
  <div class="page-center">
   <div class="text-cta-inner">
    <h2 class="text-heading">{{ module.text_heading }}</h2>
    <div class="header-accent"></div>
    {% if module.footer_subtitle %}
    <p>{{ module.footer_subtitle }}</p>
    {% endif %}
    <div>
      {{ button(module.footer_cta, module.footer_cta_text, module.button_style) }}
    </div>
   </div>
  </div>
</div>

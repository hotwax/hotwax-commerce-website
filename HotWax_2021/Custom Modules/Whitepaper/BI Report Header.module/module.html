<div class="post-banner-sectionv2">
  <div class="page-center">
    <div class="post-banner-inner2">
      <div class="topic-wrap">
         <p id="hubspot-topic_data">
            {% for topic in content.topic_list %}
                {{ topic.name }}{% if not loop.last %}{% endif %}
            {% endfor %}
         </p>
       </div>
    </div>
    <div class="fetured-image-wrap">
      {% if content.post_list_summary_featured_image %}
      <img src="{{ resize_image_url(content.post_list_summary_featured_image, 1600) }}"
        srcset="{% for w in [480, 720, 960, 1200, 1600] %}{{ resize_image_url(content.post_list_summary_featured_image, w) }} {{ w }}w{% if not loop.last %}, {% endif %}{% endfor %}"
        sizes="(max-width: 1214px) calc(100vw - 44px), 1170px"
        width="1602" height="839" style="height: auto;" fetchpriority="high"
        alt="{{ content.featured_image_alt_text|default(content.name, true)|escape }}">
      {% else %}
      <img src="{{ content.post_list_summary_featured_image }}" alt="{{ content.featured_image_alt_text|default(content.name, true)|escape }}">
      {% endif %}
    </div>
  </div>
</div>

{% require_css %}
  <style>
    {% scope_css %}
    
    .post-banner-sectionv2 {
      {{ module.style.header_spacing.css }}
    }
    
    {%if content.post_list_summary_featured_image %}
    .post-banner-sectionv2:before {
      content: unset;
    }
    {% endif %}
    {% end_scope_css %}
  </style>
{% end_require_css %}
